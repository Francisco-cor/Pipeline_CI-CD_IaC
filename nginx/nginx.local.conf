# nginx.local.conf — reverse proxy para docker compose local
# Diferencia vs nginx.conf (ECS sidecar): upstreams usan nombres de servicio de compose
# (productos:3001 etc.) en lugar de 127.0.0.1 (awsvpc shared network).
# Compose monta este archivo como /etc/nginx/nginx.conf vía volumen (ver docker-compose.yml: nginx.volumes).

worker_processes 1;

events {
    worker_connections 256;
}

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # UDS compose: servicios resolubles por DNS interno de Docker
    upstream productos { server productos:3001; }
    upstream ordenes   { server ordenes:3002; }
    upstream stock     { server stock:3003; }

    server {
        listen 80;
        server_name _;

        # Security headers (Fase 3.5 + 8.4 — hide version, HSTS, CSP, etc.)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        client_max_body_size 1m;

        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        location = /api/productos/health { proxy_pass http://productos/health; }
        location = /api/ordenes/health   { proxy_pass http://ordenes/health; }
        location = /api/stock/health     { proxy_pass http://stock/health; }
        location = /api/v1/productos/health { proxy_pass http://productos/health; }
        location = /api/v1/ordenes/health   { proxy_pass http://ordenes/health; }
        location = /api/v1/stock/health     { proxy_pass http://stock/health; }
        location = /api/productos/health/live { proxy_pass http://productos/health/live; }
        location = /api/productos/health/ready { proxy_pass http://productos/health/ready; }
        location = /api/v1/productos/health/live { proxy_pass http://productos/health/live; }
        location = /api/v1/productos/health/ready { proxy_pass http://productos/health/ready; }
        location = /api/ordenes/health/live { proxy_pass http://ordenes/health/live; }
        location = /api/ordenes/health/ready { proxy_pass http://ordenes/health/ready; }
        location = /api/v1/ordenes/health/live { proxy_pass http://ordenes/health/live; }
        location = /api/v1/ordenes/health/ready { proxy_pass http://ordenes/health/ready; }
        location = /api/stock/health/live { proxy_pass http://stock/health/live; }
        location = /api/stock/health/ready { proxy_pass http://stock/health/ready; }
        location = /api/v1/stock/health/live { proxy_pass http://stock/health/live; }
        location = /api/v1/stock/health/ready { proxy_pass http://stock/health/ready; }

        location ~ ^/api/productos(/.*)?$ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_pass http://productos/productos$1;
        }

        location ~ ^/api/v1/productos(/.*)?$ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_pass http://productos/productos$1;
        }

        location ~ ^/api/ordenes(/.*)?$ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_pass http://ordenes/ordenes$1;
        }

        location ~ ^/api/v1/ordenes(/.*)?$ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_pass http://ordenes/ordenes$1;
        }

        location ~ ^/api/stock(/.*)?$ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_pass http://stock/stock$1;
        }

        location ~ ^/api/v1/stock(/.*)?$ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id      $request_id;
            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_pass http://stock/stock$1;
        }

        location / {
            return 404 '{"error":"route not found"}';
            add_header Content-Type application/json;
        }
    }
}
