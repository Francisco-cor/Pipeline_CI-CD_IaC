# SPDX-License-Identifier: MIT
# release.yml — Fase 11.6 semantic-release on push to main (tags v* + CHANGELOG + GitHub release)
# Usa Node 24, OIDC no necesario — GITHUB_TOKEN con contents:write + pull-requests:write
# Alternativa release-please: este workflow usa semantic-release directo (conventional-changelog angular)

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint -- --cache --cache-location .eslintcache
      - run: npx prettier --check "services/*/src/**/*.js" "packages/*/src/**/*.js" "migrations/**/*.js"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: verify tag created
        run: git tag --list 'v*' | tail -n 5; echo "release workflow done"
