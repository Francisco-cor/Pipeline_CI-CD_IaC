# SPDX-License-Identifier: MIT
# release.yml — semantic-release, gated on a successful CI/CD Pipeline run.
#
# Releases must never race the pipeline: a tag pushed while main is still
# being built/tested/deployed would publish a version that can later fail CI.
# Using workflow_run makes this workflow start only after the upstream run
# finishes, and the job-level `if` requires that run to be a successful push
# to main. Pull-request runs and cancelled/failed workflows are ignored.
#
# workflow_dispatch is kept for re-running a release by hand; in that case
# there is no workflow_run payload and the default branch ref is used.
#
# The job summary prints the tag created (git describe --tags --abbrev=0) and
# the image CI built for the same push (`sha-<built commit>`). ECR is not
# retagged: semantic-release tags its own CHANGELOG commit, so the tag → image
# mapping goes through the workflow run, not through git ancestry.

name: release

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
  workflow_dispatch:

permissions:
  # semantic-release pushes the version tag and the CHANGELOG commit, and
  # @semantic-release/github comments on released issues/PRs.
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run: only a successful push build of main may release.
    # workflow_dispatch: always allowed (manual, uses the checked-out ref).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Build the exact commit CI validated, not the current main tip.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          # Keep the token persisted: @semantic-release/git pushes the tag and
          # CHANGELOG commit with plain `git push`.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      # Lint/format already ran in the CI/CD Pipeline that triggered this run.
      - run: npm ci

      # Snapshot before semantic-release so the summary can tell a new tag from
      # the previous one, and can name the image CI actually built.
      - name: Record pre-release state
        id: pre
        run: |
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # ECR intentionally keeps the CI tag scheme: every image from this push
      # is `sha-<built commit>`. semantic-release runs after CI and tags its own
      # CHANGELOG commit, so vX.Y.Z → release commit is not 1:1 with the image
      # digest. Do not retag ECR here: the safe association is the push/run id
      # plus `sha-<built commit>` in the deployment history.
      - name: Release tag summary
        run: |
          previous_tag="${{ steps.pre.outputs.tag }}"
          built_sha="${{ steps.pre.outputs.commit }}"
          current_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          release_sha="$(git rev-parse --short HEAD)"

          {
            echo "## Release"
            echo ""
            if [ -n "${current_tag}" ] && [ "${current_tag}" != "${previous_tag}" ]; then
              echo "- new tag: \`${current_tag}\`"
            elif [ -n "${current_tag}" ]; then
              echo "- no new tag (no release-worthy commit); latest tag: \`${current_tag}\`"
            else
              echo "- no tag found"
            fi
            echo "- release commit: \`${release_sha}\`"
            echo "- image tag: \`sha-${built_sha}\` (built by CI/CD Pipeline from the same push)"
            echo "- the release tag may point to the CHANGELOG commit created by semantic-release, so map tag → image through the workflow run, not through git."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release workflow done"
