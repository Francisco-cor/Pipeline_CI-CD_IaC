# SPDX-License-Identifier: MIT
# Trusted Terraform plan: remote backend access is intentionally unavailable to PRs.

name: Terraform trusted plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect with the remote state backend
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    # The OIDC trust policy accepts only refs/heads/main. Keeping this guard in
    # the workflow makes a dispatch from another ref fail closed as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -reconfigure -backend-config="environments/backend-${{ inputs.environment }}.hcl"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -out=tfplan
          # Do not upload the binary plan: this repo is public and tfplan
          # embeds sensitive values such as the RDS password. The summary
          # below uses `terraform show`, which redacts sensitive attributes.
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
