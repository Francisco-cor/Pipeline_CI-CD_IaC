# =============================================================================
# CI/CD Pipeline: lint → test → build → deploy
# Fase 6: concurrency, cache, sec (gitleaks/trivy), tf tflint/checkov, paths-filter
# Fase 8: audit (npm audit) + sec headers + rate-limit
#
# Triggers:
#   - push to main         → full pipeline (lint + test + build + deploy)
#   - pull_request to main → lint + test + static Terraform checks (no build, no deploy)
#
# Auth: GitHub Actions assumes an AWS IAM role via OIDC.
# Zero long-lived credentials stored in GitHub secrets.
# The role is created by terraform/cicd.tf.
# After terraform apply, copy the output github_actions_role_arn to
# the GitHub repo secret named AWS_ROLE_ARN.
#
# Required GitHub secrets:
#   AWS_ROLE_ARN — ARN of the IAM role created by Terraform (cicd.tf output).
#   Optional per-environment override (dev/staging/prod): GitHub resolves the
#   environment secret first and falls back to the repository secret.
#
# Fase 6 mejoras:
#   6.1 concurrency group ${workflow}-${ref} cancel-in-progress
#   6.2 docker layer cache buildx gha (cache-from/to type=gha)
#   6.3 gitleaks + trivy fs (sarif) + trivy image (post-build)
#   6.4 terraform fmt/validate/tflint/checkov en PR (sin credenciales AWS)
#   6.5 eslint --cache + prettier check (format job)
#   6.6 coverage artifact per service + job summaries
#   6.7 paths-filter → build only changed services
#   6.8 job summaries + trusted Terraform plan workflow (manual, main only)
#
# Fase 3B (delivery):
#   - migrations job runs migrations/run.js twice on a postgres:15 service to
#     prove checksum/idempotency before merge.
#   - build pushes buildx SBOM + provenance attestations with every image.
#   - deploy (dev) always runs; deploy-staging/deploy-prod are opt-in through
#     vars.ENABLE_PROMOTION == 'true' and GitHub Environments staging/prod
#     (required reviewers recommended).
#   - Each promotion runs scripts/smoke.sh against vars.STAGING_URL/PROD_URL.
#
# Required repo variables for promotion:
#   ENABLE_PROMOTION = 'true'   (otherwise staging/prod are skipped)
#   STAGING_URL, PROD_URL       (base URLs for the post-deploy smoke)
#   DEV_URL                     (optional, deployment history link for dev)
#   SMOKE_TOKEN (secret)        (optional; enables protected read checks in smoke)
# See docs/runbooks/deploy.md.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 6.1 concurrency — cancela runs previos del mismo branch/workflow.
# Only supersede PR runs: cancelling a main run could kill an in-flight
# deploy halfway through. Main runs queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: erp-pipeline
  ENVIRONMENT: dev
  NODE_VERSION: '24'

# Permisos mínimos a nivel workflow; cada job los eleva si necesita
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Detect changes (paths-filter) — Fase 6.7
  # Usa dorny/paths-filter para evitar builds innecesarios.
  # Exporta booleans por servicio; build y otros jobs consultan outputs.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      productos: ${{ steps.filter.outputs.productos }}
      ordenes: ${{ steps.filter.outputs.ordenes }}
      stock: ${{ steps.filter.outputs.stock }}
      gateway: ${{ steps.filter.outputs.gateway }}
      nginx: ${{ steps.filter.outputs.nginx }}
      migrations: ${{ steps.filter.outputs.migrations }}
      terraform: ${{ steps.filter.outputs.terraform }}
      any_service: ${{ steps.filter.outputs.any_service }}
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            productos:
              - 'services/productos/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/productos/Dockerfile'
            ordenes:
              - 'services/ordenes/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/ordenes/Dockerfile'
            stock:
              - 'services/stock/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/stock/Dockerfile'
            gateway:
              - 'services/gateway/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/gateway/Dockerfile'
            nginx:
              - 'nginx/**'
            migrations:
              - 'migrations/**'
              # The migrations image is built from the repo root, so changes
              # to the ignore rules can break it without touching migrations/.
              - '.dockerignore'
            terraform:
              - 'terraform/**'
            any_service:
              - 'services/**'
              - 'packages/**'
              - 'nginx/**'
              - 'migrations/**'
              - 'package.json'
              - 'package-lock.json'
            # Heavy jobs (audit/test/trivy-fs) only need to run when there is
            # executable code or a dependency/config change to inspect.
            code:
              - 'services/**'
              - 'packages/**'
              - 'migrations/**'
              - 'nginx/**'
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
            # e2e rebuilds the whole compose stack, so it only runs when the
            # runtime surface (services, compose, nginx, migrations) changed.
            e2e:
              - 'services/**'
              - 'packages/**'
              - 'migrations/**'
              - 'nginx/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - 'scripts/e2e.sh'
              - 'package.json'
              - 'package-lock.json'

  # ---------------------------------------------------------------------------
  # Job 1: Lint (Fase 6.5 eslint --cache + cache + summary)
  # One root install lints every workspace (the root config already covers
  # services/*, packages/*, migrations, frontend and scripts). Running four
  # matrix jobs duplicated the install and produced four red checks for the
  # same failure.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/*/package-lock.json
            migrations/package-lock.json

      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('services/*/src/**/*.js', 'packages/*/src/**/*.js', 'migrations/**/*.js', 'frontend/**/*.js', '.eslintrc.js') }}
          restore-keys: |
            eslint-

      - name: Lint workspaces (cache)
        run: npm ci --silent && npm run lint -- --cache --cache-location .eslintcache

      - name: Lint summary
        if: always()
        run: |
          echo "## Lint" >> $GITHUB_STEP_SUMMARY
          echo "- eslint --cache passed across workspaces" >> $GITHUB_STEP_SUMMARY
          echo "- cache key: eslint-${{ hashFiles('.eslintrc.js') }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1b: Prettier check (Fase 6.5)
  # Verifica formato determinístico sin modificar archivos.
  # ---------------------------------------------------------------------------
  format:
    name: Prettier check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root)
        run: npm ci --silent

      - name: Prettier check
        run: npx prettier --check "services/*/src/**/*.js" "packages/*/src/**/*.js" "migrations/**/*.js" "*.js" "*.json" "*.md"

      - name: Summary
        if: always()
        run: |
          echo "## Prettier check" >> $GITHUB_STEP_SUMMARY
          echo "- prettier --check passed" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1b.0: Documentation links (Fase 4)
  # No DB, no AWS, no npm install: just git + bash. A broken relative link in a
  # tracked .md file fails the PR before it reaches main.
  # ---------------------------------------------------------------------------
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check relative links
        run: bash scripts/check-docs-links.sh

      - name: Summary
        if: always()
        run: |
          echo "## Docs links" >> $GITHUB_STEP_SUMMARY
          echo "- relative links in tracked .md files resolve" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1b.1: Build migrations image (PR only)
  # The migrations Dockerfile COPYs root-relative paths (migrations/*, certs/*),
  # so it must be built with context=., never context=migrations. Building it on
  # PRs catches that class of breakage before it reaches main.
  # ---------------------------------------------------------------------------
  migrations-build:
    name: Build migrations image
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build migrations (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: migrations/Dockerfile
          push: false
          tags: migrations:ci-pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## Migrations image" >> $GITHUB_STEP_SUMMARY
          echo "- built from context=. (root) without pushing" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1b.2: Migration runner idempotency (PR only, Fase 3B)
  # Runs the real runner twice against a fresh postgres:15. The first pass
  # applies every migration and records its SHA-256 checksum; the second pass
  # must skip all of them. That proves the checksum/idempotency contract that
  # makes a retried ECS migration task safe.
  # Gated on the `migrations` filter: the contract lives in run.js + sql/*, so
  # a change to service code cannot affect it (the test matrix already runs the
  # runner once when `code` changes, but never twice).
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erpdb
          POSTGRES_USER: erpadmin
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://erpadmin:test_password@localhost:5432/erpdb
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: migrations/package-lock.json

      - name: First run (apply schema)
        working-directory: migrations
        run: npm ci --silent && node run.js

      - name: Second run (must skip every migration)
        working-directory: migrations
        shell: bash
        run: |
          set -o pipefail
          if ! output=$(node run.js 2>&1); then
            echo "$output"
            echo "ERROR: second migrations run failed." >&2
            exit 1
          fi
          echo "$output"

          expected=$(find sql -maxdepth 1 -name '*.sql' | wc -l)
          applied=$(grep -c '^Running migration:' <<< "$output" || true)
          skipped=$(grep -c '^Skipping already applied:' <<< "$output" || true)
          echo "expected=$expected applied=$applied skipped=$skipped"

          if [ "$applied" -ne 0 ]; then
            echo "ERROR: second run applied $applied migration(s); the runner is not idempotent." >&2
            exit 1
          fi
          if [ "$skipped" -ne "$expected" ]; then
            echo "ERROR: second run skipped $skipped of $expected migrations; expected all of them." >&2
            exit 1
          fi
          if ! grep -q 'All migrations completed successfully.' <<< "$output"; then
            echo "ERROR: second run did not report success." >&2
            exit 1
          fi
          echo "Idempotency OK: $skipped migrations skipped on the second run."

      - name: Migrations summary
        if: always()
        run: |
          echo "## Migrations runner" >> $GITHUB_STEP_SUMMARY
          echo "- postgres:15 service container" >> $GITHUB_STEP_SUMMARY
          echo "- first run applied the schema, second run skipped every migration" >> $GITHUB_STEP_SUMMARY
          echo "- checksums and idempotency validated" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1c: npm audit (Fase 8.7) — fail on HIGH in backend workspaces
  # The root lockfile aggregates every workspace, so a single audit covers
  # productos/ordenes/stock/gateway without four installs.
  # ---------------------------------------------------------------------------
  audit:
    name: Audit
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm audit (HIGH, prod only)
        run: npm ci --silent && npm audit --audit-level=high --omit=dev

      - name: Summary
        if: always()
        run: |
          echo "## Audit" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit --audit-level=high passed (all workspaces)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1d: Gitleaks (Fase 6.3)
  # Escanea el historial completo por secretos hardcodeados y bloquea el pipeline.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Gitleaks" >> $GITHUB_STEP_SUMMARY
          echo "- no leaked secrets detected" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 1d: Trivy FS (Fase 6.3)
  # Escanea filesystem por HIGH/CRITICAL vulns, sube SARIF a code scanning.
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: Trivy FS
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy FS
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        # The scan fails closed (exit-code 1) before writing SARIF when Trivy
        # errors early; only upload when the file exists.
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif

      - name: Summary
        if: always()
        run: |
          echo "## Trivy FS" >> $GITHUB_STEP_SUMMARY
          echo "- scanned filesystem for HIGH/CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- SARIF uploaded to code scanning" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 2: Test (Fase 6.6 coverage + summary, mantiene matrix isolation)
  # Matrix: runs Jest against a real postgres:15 service container.
  # Cada variante tiene su runner + DB aislada.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.service }})
    needs: [lint, format, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [productos, ordenes, stock, gateway]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erpdb
          POSTGRES_USER: erpadmin
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://erpadmin:test_password@localhost:5432/erpdb
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            migrations/package-lock.json
            services/${{ matrix.service }}/package-lock.json

      - name: Run database migrations
        run: npm ci --silent && node run.js
        working-directory: migrations

      - name: Test svc-${{ matrix.service }} (coverage)
        run: npm ci --silent && npm test -- --coverage --coverageReporters=lcov --coverageReporters=text
        working-directory: services/${{ matrix.service }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- jest --coverage passed" >> $GITHUB_STEP_SUMMARY
          if [ -f "services/${{ matrix.service }}/coverage/lcov.info" ]; then echo "- lcov uploaded" >> $GITHUB_STEP_SUMMARY; fi
          if [ -f "services/${{ matrix.service }}/coverage/coverage-summary.json" ]; then cat "services/${{ matrix.service }}/coverage/coverage-summary.json" | head -n 30 >> $GITHUB_STEP_SUMMARY || true; fi

  # ---------------------------------------------------------------------------
  # Job 2.5: e2e smoke (compose → nginx → servicios)
  # Runs docker compose with postgres + migrations + servicios + nginx,
  # then curl smoke via scripts/e2e.sh. Fase 4.8
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e smoke
    needs: [test, changes]
    # Run when tests passed, or when only the runtime plumbing (compose/e2e
    # script) changed and the test matrix was legitimately skipped.
    if: |
      always() && needs.changes.outputs.e2e == 'true' &&
      (needs.test.result == 'success' || needs.changes.outputs.code != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Use the base file only: the override mounts sources and runs nodemon,
      # which is a dev setup, not what we want to smoke-test in CI.
      - name: Build and up
        run: docker compose -f docker-compose.yml up -d --build --wait
      - name: Wait for nginx healthy
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf http://localhost:80/health >/dev/null; then echo "nginx ready"; exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml logs
          exit 1
      - name: Run e2e smoke
        run: bash scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Down
        if: always()
        run: docker compose -f docker-compose.yml down -v
      - name: Summary
        if: always()
        run: |
          echo "## e2e smoke" >> $GITHUB_STEP_SUMMARY
          echo "- compose + nginx → servicios passed" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 3: Terraform (PRs only) — Fase 6.4
  # fmt -check + init + validate + tflint + checkov. This job deliberately
  # does not assume AWS: untrusted PR code must not receive cloud credentials.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform checks
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.53.0

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init (backend false)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: terraform

      # The CI identity is a separate root so the nightly destroy cannot
      # remove it. Validate it without a backend or credentials.
      - name: Terraform init bootstrap (backend false)
        run: terraform init -backend=false -input=false
        working-directory: terraform/bootstrap

      - name: Terraform validate bootstrap
        run: terraform validate -no-color
        working-directory: terraform/bootstrap

      - name: TFLint init
        run: tflint --init
        working-directory: terraform

      - name: TFLint
        # Warnings stay visible in the log but only errors block the PR.
        run: tflint --recursive --format compact --minimum-failure-severity=error
        working-directory: terraform

      - name: Checkov (sarif)
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          quiet: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        # Checkov exits before writing the SARIF on framework errors.
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif

      - name: Terraform checks summary
        if: always()
        run: |
          echo "## Terraform static checks" >> $GITHUB_STEP_SUMMARY
          echo "- fmt/validate/tflint/checkov passed without AWS credentials" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 4: Build (Fase 6.2 buildx gha cache + 6.7 paths-filter per-service)
  # Solo en push a main y si hubo cambios en services/packages/nginx/migrations.
  # Usa docker/build-push-action con cache-from/to type=gha (GitHub cache API).
  # Construye solo servicios cambiados para ahorrar minutos y ECR pushes.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push to ECR
    needs: [test, e2e, audit, gitleaks, trivy-fs, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.any_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      deploy_services: ${{ steps.deploy_services.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Compute image tag
        id: tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve changed services
        id: deploy_services
        shell: bash
        run: |
          services=()
          [[ "${{ needs.changes.outputs.productos }}" == "true" ]] && services+=(productos)
          [[ "${{ needs.changes.outputs.ordenes }}" == "true" ]] && services+=(ordenes)
          [[ "${{ needs.changes.outputs.stock }}" == "true" ]] && services+=(stock)
          [[ "${{ needs.changes.outputs.gateway }}" == "true" ]] && services+=(gateway)
          [[ "${{ needs.changes.outputs.nginx }}" == "true" ]] && services+=(nginx)
          [[ "${{ needs.changes.outputs.migrations }}" == "true" ]] && services+=(migrations)
          if [ "${#services[@]}" -eq 0 ]; then
            echo "No deployable service changes detected." >&2
            exit 1
          fi
          (IFS=,; echo "value=${services[*]}") >> "$GITHUB_OUTPUT"

      - name: ECR base
        id: ecr
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "base=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      # --- productos ---
      - name: Build & push productos
        if: needs.changes.outputs.productos == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/productos/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-productos:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-productos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx attaches an SPDX SBOM and a SLSA provenance manifest to the
          # pushed index. They are attestations, not extra tags.
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.value }}

      - name: Build productos skipped
        if: needs.changes.outputs.productos != 'true'
        run: echo "skip productos — no changes" >> $GITHUB_STEP_SUMMARY

      # --- ordenes ---
      - name: Build & push ordenes
        if: needs.changes.outputs.ordenes == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/ordenes/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-ordenes:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-ordenes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.value }}

      - name: Build ordenes skipped
        if: needs.changes.outputs.ordenes != 'true'
        run: echo "skip ordenes — no changes" >> $GITHUB_STEP_SUMMARY

      # --- stock ---
      - name: Build & push stock
        if: needs.changes.outputs.stock == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/stock/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-stock:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-stock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.value }}

      - name: Build stock skipped
        if: needs.changes.outputs.stock != 'true'
        run: echo "skip stock — no changes" >> $GITHUB_STEP_SUMMARY

      # --- gateway ---
      - name: Build & push gateway
        if: needs.changes.outputs.gateway == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-gateway:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.value }}

      - name: Build gateway skipped
        if: needs.changes.outputs.gateway != 'true'
        run: echo "skip gateway — no changes" >> $GITHUB_STEP_SUMMARY

      # --- nginx ---
      - name: Build & push nginx
        if: needs.changes.outputs.nginx == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nginx
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-nginx:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.value }}

      - name: Build nginx skipped
        if: needs.changes.outputs.nginx != 'true'
        run: echo "skip nginx — no changes" >> $GITHUB_STEP_SUMMARY

      # --- migrations ---
      - name: Build & push migrations
        if: needs.changes.outputs.migrations == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Root context: migrations/Dockerfile copies migrations/* and certs/*.
          context: .
          file: migrations/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-migrations:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-migrations:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.value }}

      - name: Build migrations skipped
        if: needs.changes.outputs.migrations != 'true'
        run: echo "skip migrations — no changes" >> $GITHUB_STEP_SUMMARY

      - name: Build summary
        if: always()
        run: |
          echo "## Build — ${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "- productos: ${{ needs.changes.outputs.productos }}" >> $GITHUB_STEP_SUMMARY
          echo "- ordenes: ${{ needs.changes.outputs.ordenes }}" >> $GITHUB_STEP_SUMMARY
          echo "- stock: ${{ needs.changes.outputs.stock }}" >> $GITHUB_STEP_SUMMARY
          echo "- gateway: ${{ needs.changes.outputs.gateway }}" >> $GITHUB_STEP_SUMMARY
          echo "- nginx: ${{ needs.changes.outputs.nginx }}" >> $GITHUB_STEP_SUMMARY
          echo "- migrations: ${{ needs.changes.outputs.migrations }}" >> $GITHUB_STEP_SUMMARY
          echo "- cache: type=gha (buildx)" >> $GITHUB_STEP_SUMMARY
          echo "- supply chain: SBOM + provenance attestations attached to each pushed image" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 4b: Trivy image scan (Fase 6.3)
  # Escanea imágenes recién pusheadas y bloquea HIGH/CRITICAL conocidos.
  # ---------------------------------------------------------------------------
  trivy-image:
    name: Trivy image (${{ matrix.service }})
    needs: [build, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.any_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      security-events: write
    strategy:
      matrix:
        service: [productos, ordenes, stock, gateway, nginx, migrations]
      fail-fast: false
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: ECR base
        id: ecr
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "base=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Run Trivy image scan
        if: |
          (matrix.service == 'productos' && needs.changes.outputs.productos == 'true') ||
          (matrix.service == 'ordenes' && needs.changes.outputs.ordenes == 'true') ||
          (matrix.service == 'stock' && needs.changes.outputs.stock == 'true') ||
          (matrix.service == 'gateway' && needs.changes.outputs.gateway == 'true') ||
          (matrix.service == 'nginx' && needs.changes.outputs.nginx == 'true') ||
          (matrix.service == 'migrations' && needs.changes.outputs.migrations == 'true')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.base }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        # A failed scan may exit before producing the SARIF, and skipped
        # services never produce one; guard on both.
        if: |
          always() &&
          hashFiles(format('trivy-image-{0}.sarif', matrix.service)) != '' && (
            (matrix.service == 'productos' && needs.changes.outputs.productos == 'true') ||
            (matrix.service == 'ordenes' && needs.changes.outputs.ordenes == 'true') ||
            (matrix.service == 'stock' && needs.changes.outputs.stock == 'true') ||
            (matrix.service == 'gateway' && needs.changes.outputs.gateway == 'true') ||
            (matrix.service == 'nginx' && needs.changes.outputs.nginx == 'true') ||
            (matrix.service == 'migrations' && needs.changes.outputs.migrations == 'true')
          )
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Summary
        if: always()
        run: |
          echo "## Trivy image ${{ matrix.service }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- scanned for CRITICAL/HIGH (blocking gate)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 5: Deploy to dev
  # Register a new ECS task definition revision (with the just-pushed image tag)
  # and update the service. Waits for the deployment to stabilize.
  # If health checks fail after deployment, ECS auto-rolls back (circuit breaker).
  #
  # `environment: dev` records the deployment in GitHub (history + URL) and is
  # the hook where a dev environment secret/reviewer could be added later.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ECS (dev)
    needs: [build, trivy-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: dev
      # Fall back to the run URL: GitHub rejects an empty environment URL in
      # some configurations, and the deployment history still needs a target.
      url: ${{ vars.DEV_URL != '' && vars.DEV_URL || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Environment secret wins over the repo secret when both exist, so
          # dev/staging/prod can assume different roles later without editing
          # the workflow.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          chmod +x scripts/deploy.sh
          bash scripts/deploy.sh
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_SERVICES: ${{ needs.build.outputs.deploy_services }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy dev — ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- cluster: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" >> $GITHUB_STEP_SUMMARY
          echo "- image: ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- services: ${{ needs.build.outputs.deploy_services }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 5b: Promote to staging (Fase 3B)
  # Same image tag/digests that dev just validated. Disabled unless the repo
  # variable ENABLE_PROMOTION is 'true'. The `staging` GitHub Environment can
  # require reviewers, so the job pauses before it touches AWS.
  #
  # STAGING_URL is mandatory: a promotion without a post-deploy smoke target
  # would be a blind deploy. The job fails before assuming the AWS role.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to ECS (staging)
    needs: [build, trivy-image, deploy]
    if: |
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.ENABLE_PROMOTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL != '' && vars.STAGING_URL || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
    concurrency:
      # Never run two promotions into the same environment in parallel.
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require STAGING_URL
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "${STAGING_URL}" ]; then
            echo "ERROR: vars.STAGING_URL is not configured." >&2
            echo "Set it in Settings → Secrets and variables → Actions → Variables (or on the staging Environment) before enabling promotion." >&2
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS (staging)
        run: |
          chmod +x scripts/deploy.sh
          bash scripts/deploy.sh
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_SERVICES: ${{ needs.build.outputs.deploy_services }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: staging

      - name: Smoke staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          # Optional: lets the smoke verify protected reads. Without it the
          # script only checks public health endpoints.
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          chmod +x scripts/smoke.sh
          bash scripts/smoke.sh "${STAGING_URL}"

      - name: Staging summary
        if: always()
        run: |
          echo "## Deploy staging — ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- environment: staging (approval recorded in the deployment history)" >> $GITHUB_STEP_SUMMARY
          echo "- image: ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- smoke: ${{ vars.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 5c: Promote to prod (Fase 3B)
  # Depends on deploy-staging, so a failed staging deploy or smoke test blocks
  # prod by construction. Requires the `prod` GitHub Environment (reviewers).
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to ECS (prod)
    # build is listed again because the `needs` context only exposes direct
    # dependencies; prod still waits for deploy-staging to succeed.
    needs: [build, deploy-staging]
    if: |
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.ENABLE_PROMOTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ vars.PROD_URL != '' && vars.PROD_URL || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require PROD_URL
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "${PROD_URL}" ]; then
            echo "ERROR: vars.PROD_URL is not configured." >&2
            echo "Set it in Settings → Secrets and variables → Actions → Variables (or on the prod Environment) before enabling promotion." >&2
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS (prod)
        run: |
          chmod +x scripts/deploy.sh
          bash scripts/deploy.sh
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_SERVICES: ${{ needs.build.outputs.deploy_services }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: prod

      - name: Smoke prod
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          chmod +x scripts/smoke.sh
          bash scripts/smoke.sh "${PROD_URL}"

      - name: Prod summary
        if: always()
        run: |
          echo "## Deploy prod — ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- environment: prod (approval recorded in the deployment history)" >> $GITHUB_STEP_SUMMARY
          echo "- image: ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- smoke: ${{ vars.PROD_URL }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 6: Aggregate required check.
  # Branch protection should require only this job: adding a new job to the
  # pipeline does not require editing the protection rule, and a failed or
  # cancelled dependency cannot be masked by the others. `skipped` is fine
  # (e.g. deploy never runs on PRs, build is skipped when nothing changed).
  # ---------------------------------------------------------------------------
  ci-required:
    name: CI required
    needs:
      - changes
      - lint
      - format
      - docs-links
      - migrations-build
      - migrations
      - audit
      - gitleaks
      - trivy-fs
      - test
      - e2e
      - terraform
      - build
      - trivy-image
      - deploy
      - deploy-staging
      - deploy-prod
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check dependency results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failures=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key)=\(.value.result)"')
          if [ -n "$failures" ]; then
            echo "Required jobs failed or were cancelled:" >&2
            echo "$failures" >&2
            exit 1
          fi
          echo "All required jobs passed or were skipped."
