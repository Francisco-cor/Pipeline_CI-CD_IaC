# SPDX-License-Identifier: MIT
version: 2

# One grouped PR per directory instead of one PR per dependency, checked
# monthly. Weekly runs accumulated ~30 open PRs that nothing merged, and each
# rebase re-triggered the full CI pipeline.
# `rebase-strategy: disabled` stops Dependabot from pushing to open PRs just
# because main moved, which was another source of repeated runs.
updates:
  # Root workspace — release toolchain and shared packages
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    labels: [deps, npm]
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      root-npm:
        patterns: ['*']

  # npm — Node services + migrations. Each directory is a separate Dependabot
  # target, so grouping keeps it to one PR per service.
  - package-ecosystem: npm
    directory: /services/productos
    schedule: { interval: monthly }
    labels: [deps, npm]
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      productos-npm:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /services/ordenes
    schedule: { interval: monthly }
    labels: [deps, npm]
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      ordenes-npm:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /services/stock
    schedule: { interval: monthly }
    labels: [deps, npm]
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      stock-npm:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /migrations
    schedule: { interval: monthly }
    labels: [deps, npm]
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      migrations-npm:
        patterns: ['*']

  # Docker — nginx + node bases. Major base-image bumps (e.g. node 24 -> 25)
  # are ignored on purpose: they change the runtime and were sitting open
  # without a merge path.
  - package-ecosystem: docker
    directory: /services/productos
    schedule: { interval: monthly }
    labels: [deps, docker]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /services/ordenes
    schedule: { interval: monthly }
    labels: [deps, docker]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /services/stock
    schedule: { interval: monthly }
    labels: [deps, docker]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /nginx
    schedule: { interval: monthly }
    labels: [deps, docker]
    open-pull-requests-limit: 1
    rebase-strategy: disabled

  - package-ecosystem: docker
    directory: /migrations
    schedule: { interval: monthly }
    labels: [deps, docker]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Terraform — providers grouped into one PR
  - package-ecosystem: terraform
    directory: /terraform
    schedule: { interval: monthly }
    labels: [deps, terraform]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      terraform-providers:
        patterns: ['*']

  # GitHub Actions — all action bumps in one PR
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [deps, github-actions]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ['*']
