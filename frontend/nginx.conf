# Static dashboard server. Kept separate from the API NGINX config so the
# frontend can ship a strict CSP without weakening the API edge.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The page uses external app.js and styles.css only: no inline <script>, no
    # inline event handlers (script-src-attr 'none'), and no inline style
    # attributes (style-src 'self'). See frontend/README.md for the budget.
    # connect-src permits the local API origins and HTTPS endpoints. Tighten
    # this to the deployed API origin in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Static assets are small; gzip cuts transfer for app.js/styles.css/json.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
