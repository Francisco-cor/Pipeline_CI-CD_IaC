# Static dashboard server. Kept separate from the API NGINX config so the
# frontend can ship a strict CSP without weakening the API edge.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # script-src has no 'unsafe-inline': the page uses external app.js only.
    # style-src keeps 'unsafe-inline' for the existing inline layout styles;
    # remove it after those attributes move into styles.css.
    # connect-src permits the local API origins and HTTPS endpoints. Tighten
    # this to the deployed API origin in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
